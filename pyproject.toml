[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-financial-analyst"
version = "0.1.0"
description = "Local multi-agent financial market research platform"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "yfinance>=0.2.65",
    "duckdb>=1.4",
    "pandas>=2.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

